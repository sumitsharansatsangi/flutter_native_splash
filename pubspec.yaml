name: flutter_native_splash
description: Customize Flutter's default white native splash screen with
  background color and splash image. Supports dark mode, full screen, and more.
version: 2.4.6
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
repository: https://github.com/jonbhanson/flutter_native_splash
issue_tracker: https://github.com/jonbhanson/flutter_native_splash/issues

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.41.0"

dependencies:
  args: ^2.7.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  html: ^0.15.6
  image:
    git: https://github.com/kumsumit/image.git
  meta: ^1.17.0
  path: ^1.9.1
  universal_io: ^2.3.1
  xml: ^7.0.1
  yaml: ^3.1.3
  ansicolor: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  
